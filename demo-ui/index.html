<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MinIO POC Demo</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a2e; background: #f4f6fb; }
    body { max-width: 960px; margin: 0 auto; padding: 2rem; }
    section { background: #fff; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    label { display: block; margin: .5rem 0 .2rem; font-weight: 600; }
    input, select, button { width: 100%; box-sizing: border-box; padding: .55rem; margin-bottom: .5rem; }
    button { background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button.secondary { background: #64748b; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    pre { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 8px; overflow-x: auto; font-size: .8rem; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>MinIO Storage POC</h1>
  <p>S3 API via nginx :80 · data in <code>./data/minio</code> on your machine</p>

  <section>
    <h2>Anonymous public file</h2>
    <a id="welcome-link" href="#" target="_blank">welcome.txt</a>
  </section>

  <section>
    <h2>Presigned flows</h2>
    <div class="row">
      <div>
        <label>Scope</label>
        <select id="scope">
          <option value="public">public/</option>
          <option value="private">private/</option>
        </select>
      </div>
      <div>
        <label>Object key</label>
        <input id="objectKey" value="demo.txt" />
      </div>
    </div>
    <label>Expiry seconds (optional)</label>
    <input id="expiry" type="number" />
    <label>File</label>
    <input id="file" type="file" />
    <button onclick="presignUpload()">Presigned PUT + upload</button>
    <button class="secondary" onclick="presignDownload()">Presigned GET</button>
    <button class="secondary" onclick="presignDelete()">Presigned DELETE</button>
    <pre id="output">…</pre>
  </section>

  <script>
    const API = 'http://localhost:8080';
    const PUBLIC_BASE = 'http://localhost/dobox-dev-bucket';
    document.getElementById('welcome-link').href = PUBLIC_BASE + '/public/welcome.txt';

    async function callApi(scope, action, body) {
      const res = await fetch(`${API}/v1/${scope}/minio/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || JSON.stringify(data));
      return data;
    }

    function log(o) { document.getElementById('output').textContent = JSON.stringify(o, null, 2); }
    function payload() {
      const b = { objectKey: document.getElementById('objectKey').value };
      const e = document.getElementById('expiry').value;
      if (e) b.expirySeconds = Number(e);
      return b;
    }

    async function presignUpload() {
      const scope = document.getElementById('scope').value;
      const file = document.getElementById('file').files[0];
      const body = payload();
      if (file) body.contentType = file.type || 'application/octet-stream';
      try {
        const data = await callApi(scope, 'upload', body);
        if (file && data.presignedUrl) {
          const r = await fetch(data.presignedUrl, { method: 'PUT', headers: { 'Content-Type': body.contentType }, body: file });
          log({ ...data, uploadStatus: r.status });
        } else log(data);
      } catch (e) { log({ error: e.message }); }
    }

    async function presignDownload() {
      try {
        const data = await callApi(document.getElementById('scope').value, 'download', payload());
        log(data);
        if (data.presignedUrl) window.open(data.presignedUrl, '_blank');
      } catch (e) { log({ error: e.message }); }
    }

    async function presignDelete() {
      try {
        const data = await callApi(document.getElementById('scope').value, 'delete', payload());
        if (data.presignedUrl) {
          const r = await fetch(data.presignedUrl, { method: 'DELETE' });
          log({ ...data, deleteStatus: r.status });
        } else log(data);
      } catch (e) { log({ error: e.message }); }
    }
  </script>
</body>
</html>
