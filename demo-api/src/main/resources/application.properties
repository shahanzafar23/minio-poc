server.port=8080

minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost}
minio.access-key=${MINIO_ACCESS_KEY:demo-app}
minio.secret-key=${MINIO_SECRET_KEY:demo-app-secret}
minio.bucket=${MINIO_BUCKET:dobox-dev-bucket}
minio.region=${MINIO_REGION:us-east-1}

minio.presign.default-expiry-seconds=3600
minio.presign.public-expiry-seconds=172800
minio.presign.max-expiry-seconds=86400

# Demo UI runs on :8088 — browser calls this API on :8080
cors.allowed-origins=http://localhost:8088,http://127.0.0.1:8088
